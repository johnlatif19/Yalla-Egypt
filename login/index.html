<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF9EF">

  <title>Sign in — Yalla Egypt</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="/login">

  <link rel="icon" type="image/webp" href="/assets/images/logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/rtl.css">

  <style>
    /* لون النص جوه الحقول عشان ميبقاش أبيض */
    .form-input {
      color: var(--color-text) !important;
    }
    /* تنسيق زرار العين */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper .form-input {
      padding-right: 40px; /* مساحة للزرار */
    }
    [dir="rtl"] .password-wrapper .form-input {
      padding-right: 1rem;
      padding-left: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    [dir="rtl"] .toggle-password {
      right: auto;
      left: 10px;
    }
    .toggle-password:hover {
      color: var(--color-primary);
    }
  </style>

  <script type="module">
    import { initTheme } from '/assets/js/ui/theme.js';
    initTheme();
  </script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skipToContent">Skip to main content</a>

  <main id="main" class="login-shell">
    <div class="login-card">

      <a href="/" aria-label="Yalla Egypt">
        <img src="/assets/images/logo.webp" alt="Yalla Egypt" class="login-card__logo">
      </a>

      <h1 class="login-card__title" data-i18n="login.pageTitle">Sign in</h1>
      <p class="login-card__subtitle" data-i18n="login.subtitle">Administrator access only.</p>

      <div id="login-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label form-label--required" data-i18n="login.emailLabel">Email address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            required
            autocomplete="email"
            aria-describedby="login-email-error"
            maxlength="180"
          >
          <p class="form-error" id="login-email-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label form-label--required" data-i18n="login.passwordLabel">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="login-password"
              name="password"
              class="form-input"
              required
              autocomplete="current-password"
              aria-describedby="login-password-error"
              minlength="6"
            >
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
              <!-- Eye icon SVG -->
              <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="form-error" id="login-password-error" hidden></p>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn--primary btn--block btn--lg">
          <span id="login-submit-label" data-i18n="login.submitButton">Sign in</span>
          <span id="login-submit-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <div style="margin-top: var(--space-5); text-align: center;">
        <a href="/" class="text-muted" style="font-size: var(--fs-sm);" data-i18n="login.backHome">Back to home</a>
      </div>

      <div style="margin-top: var(--space-5); display: flex; justify-content: center; gap: var(--space-2);">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
        <button type="button" class="icon-btn" data-lang-toggle aria-label="Switch language">
          <span data-lang-label style="font-size: var(--fs-xs); font-weight: var(--fw-semibold);">AR</span>
        </button>
      </div>

    </div>
  </main>

  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
