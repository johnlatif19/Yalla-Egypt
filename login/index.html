<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF9EF">

  <title>Sign in — Yalla Egypt</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="/login">

  <link rel="icon" type="image/webp" href="/assets/images/logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/rtl.css">

  <script type="module">
    import { initTheme } from '/assets/js/ui/theme.js';
    initTheme();
  </script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skipToContent">Skip to main content</a>

  <main id="main" class="login-shell">
    <div class="login-card">

      <a href="/" aria-label="Yalla Egypt">
        <img src="/assets/images/logo.webp" alt="Yalla Egypt" class="login-card__logo">
      </a>

      <h1 class="login-card__title" data-i18n="login.pageTitle">Sign in</h1>
      <p class="login-card__subtitle" data-i18n="login.subtitle">Administrator access only.</p>

      <div id="login-alert" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email" class="form-label form-label--required" data-i18n="login.emailLabel">Email address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            class="form-input"
            required
            autocomplete="email"
            aria-describedby="login-email-error"
            maxlength="180"
          >
          <p class="form-error" id="login-email-error" hidden></p>
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label form-label--required" data-i18n="login.passwordLabel">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            class="form-input"
            required
            autocomplete="current-password"
            aria-describedby="login-password-error"
            minlength="6"
          >
          <p class="form-error" id="login-password-error" hidden></p>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn--primary btn--block btn--lg">
          <span id="login-submit-label" data-i18n="login.submitButton">Sign in</span>
          <span id="login-submit-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <div style="margin-top: var(--space-5); text-align: center;">
        <a href="/" class="text-muted" style="font-size: var(--fs-sm);" data-i18n="login.backHome">Back to home</a>
      </div>

      <div style="margin-top: var(--space-5); display: flex; justify-content: center; gap: var(--space-2);">
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
        <button type="button" class="icon-btn" data-lang-toggle aria-label="Switch language">
          <span data-lang-label style="font-size: var(--fs-xs); font-weight: var(--fw-semibold);">AR</span>
        </button>
      </div>

    </div>
  </main>

  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
