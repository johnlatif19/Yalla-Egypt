<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF9EF">

  <title>Settings — Yalla Egypt Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="/dashboard/settings">

  <link rel="icon" type="image/webp" href="/assets/images/logo.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <link rel="stylesheet" href="/assets/css/rtl.css">

  <script type="module">
    import { initTheme } from '/assets/js/ui/theme.js';
    initTheme();
  </script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="a11y.skipToContent">Skip to main content</a>

  <div class="dashboard-shell">
    <aside class="dashboard-sidebar" id="dashboard-sidebar">
      <div class="dashboard-sidebar__header">
        <a href="/dashboard" class="dashboard-sidebar__brand">
          <img src="/assets/images/logo.webp" alt="Yalla Egypt" height="36" width="auto">
          <span class="dashboard-sidebar__brand-text" data-i18n="dashboard.pageTitle">Dashboard</span>
        </a>
        <button type="button" class="icon-btn dashboard-sidebar-toggle" data-sidebar-close aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav aria-label="Dashboard navigation">
        <ul class="dashboard-nav">
          <li>
            <a href="/dashboard" class="dashboard-nav__link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span data-i18n="dashboard.overview">Overview</span>
            </a>
          </li>
          <li>
            <a href="/dashboard/tours" class="dashboard-nav__link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
              <span data-i18n="dashboard.tours">Tours</span>
            </a>
          </li>
          <li>
            <a href="/dashboard/bookings" class="dashboard-nav__link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
              <span data-i18n="dashboard.bookings">Bookings</span>
            </a>
          </li>
          <li>
            <a href="/dashboard/gallery" class="dashboard-nav__link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
              <span data-i18n="dashboard.gallery">Gallery</span>
            </a>
          </li>
          <li>
            <a href="/dashboard/settings" class="dashboard-nav__link" aria-current="page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
              <span data-i18n="dashboard.settings">Settings</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="dashboard-sidebar__footer">
        <button type="button" class="btn btn--ghost btn--block" data-logout>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-inline-end: var(--space-2);"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span data-i18n="dashboard.logout">Sign out</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" data-sidebar-backdrop></div>

    <div class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="flex items-center gap-3">
          <button type="button" class="icon-btn dashboard-sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <h1 class="dashboard-topbar__title" data-i18n="dashboard.settings">Settings</h1>
        </div>
        <div class="dashboard-topbar__actions">
          <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
          <button type="button" class="icon-btn" data-lang-toggle aria-label="Switch language">
            <span data-lang-label style="font-size: var(--fs-xs); font-weight: var(--fw-semibold);">AR</span>
          </button>
        </div>
      </header>

      <main id="main" class="dashboard-content">

        <form id="settings-form" novalidate>

          <section class="settings-section">
            <h3 data-i18n="dashboard.brandSection">Brand</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="brandNameEn" class="form-label" data-i18n="dashboard.brandNameEn">Brand name (English)</label>
                <input type="text" id="brandNameEn" name="brandNameEn" class="form-input" maxlength="120">
              </div>
              <div class="form-group">
                <label for="brandNameAr" class="form-label" data-i18n="dashboard.brandNameAr">Brand name (Arabic)</label>
                <input type="text" id="brandNameAr" name="brandNameAr" class="form-input" dir="rtl" maxlength="120">
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h3 data-i18n="dashboard.contactSection">Contact</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="contactEmail" class="form-label" data-i18n="dashboard.emailLabel">Email</label>
                <input type="email" id="contactEmail" name="contactEmail" class="form-input" maxlength="180">
              </div>
              <div class="form-group">
                <label for="contactPhone" class="form-label" data-i18n="dashboard.phoneLabel">Phone</label>
                <input type="tel" id="contactPhone" name="contactPhone" class="form-input" maxlength="32">
              </div>
              <div class="form-group">
                <label for="contactWhatsapp" class="form-label" data-i18n="dashboard.whatsapp">WhatsApp number</label>
                <input type="tel" id="contactWhatsapp" name="contactWhatsapp" class="form-input" maxlength="32">
              </div>
              <div class="form-group">
                <label for="contactLocation" class="form-label" data-i18n="dashboard.location">Location</label>
                <input type="text" id="contactLocation" name="contactLocation" class="form-input" maxlength="120">
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h3 data-i18n="dashboard.guideSection">Guide</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="guideName" class="form-label" data-i18n="dashboard.guideName">Guide name</label>
                <input type="text" id="guideName" name="guideName" class="form-input" maxlength="120">
              </div>
              <div class="form-group">
                <label for="guideLanguages" class="form-label" data-i18n="dashboard.guideLanguages">Languages (comma separated)</label>
                <input type="text" id="guideLanguages" name="guideLanguages" class="form-input" maxlength="200">
              </div>
              <div class="form-group form-group--full">
                <label for="guideBioEn" class="form-label" data-i18n="dashboard.guideBioEn">Guide bio (English)</label>
                <textarea id="guideBioEn" name="guideBioEn" class="form-textarea" rows="4" maxlength="3000"></textarea>
              </div>
              <div class="form-group form-group--full">
                <label for="guideBioAr" class="form-label" data-i18n="dashboard.guideBioAr">Guide bio (Arabic)</label>
                <textarea id="guideBioAr" name="guideBioAr" class="form-textarea" rows="4" maxlength="3000" dir="rtl"></textarea>
              </div>
              <div class="form-group form-group--full">
                <label class="form-label" data-i18n="dashboard.guidePhoto">Guide photo</label>
                <div class="image-uploader">
                  <input type="file" id="guide-photo-input" accept="image/*" hidden>
                  <div class="image-uploader__preview" id="guide-photo-preview" style="max-width: 240px;"></div>
                  <button type="button" id="guide-photo-btn" class="btn btn--outline btn--sm" style="align-self: flex-start;" data-i18n="dashboard.uploadImage">Upload image</button>
                </div>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h3 data-i18n="dashboard.socialSection">Social links</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="socialInstagram" class="form-label" data-i18n="dashboard.instagram">Instagram URL</label>
                <input type="url" id="socialInstagram" name="socialInstagram" class="form-input" maxlength="300">
              </div>
              <div class="form-group">
                <label for="socialFacebook" class="form-label" data-i18n="dashboard.facebook">Facebook URL</label>
                <input type="url" id="socialFacebook" name="socialFacebook" class="form-input" maxlength="300">
              </div>
              <div class="form-group">
                <label for="socialTiktok" class="form-label" data-i18n="dashboard.tiktok">TikTok URL</label>
                <input type="url" id="socialTiktok" name="socialTiktok" class="form-input" maxlength="300">
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h3 data-i18n="dashboard.currencySection">Currency</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="defaultCurrency" class="form-label" data-i18n="dashboard.currencyDefault">Default currency</label>
                <input type="text" id="defaultCurrency" name="defaultCurrency" class="form-input" maxlength="6" placeholder="EGP">
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h3 data-i18n="dashboard.seoSection">SEO</h3>
            <div class="settings-grid">
              <div class="form-group">
                <label for="seoTitleEn" class="form-label" data-i18n="dashboard.seoTitleEn">SEO title (English)</label>
                <input type="text" id="seoTitleEn" name="seoTitleEn" class="form-input" maxlength="160">
              </div>
              <div class="form-group">
                <label for="seoTitleAr" class="form-label" data-i18n="dashboard.seoTitleAr">SEO title (Arabic)</label>
                <input type="text" id="seoTitleAr" name="seoTitleAr" class="form-input" maxlength="160" dir="rtl">
              </div>
              <div class="form-group form-group--full">
                <label for="seoDescEn" class="form-label" data-i18n="dashboard.seoDescEn">SEO description (English)</label>
                <textarea id="seoDescEn" name="seoDescEn" class="form-textarea" rows="2" maxlength="300"></textarea>
              </div>
              <div class="form-group form-group--full">
                <label for="seoDescAr" class="form-label" data-i18n="dashboard.seoDescAr">SEO description (Arabic)</label>
                <textarea id="seoDescAr" name="seoDescAr" class="form-textarea" rows="2" maxlength="300" dir="rtl"></textarea>
              </div>
            </div>
          </section>

          <div class="flex justify-between items-center gap-3 flex-wrap" style="margin-top: var(--space-6);">
            <p class="text-muted" style="font-size: var(--fs-xs);" data-i18n="dashboard.settingsNote">
              These details appear on the public website and in the footer.
            </p>
            <button type="submit" id="settings-save-btn" class="btn btn--primary btn--lg" data-i18n="dashboard.save">Save</button>
          </div>

        </form>

      </main>
    </div>
  </div>

  <script type="module" src="/assets/js/dashboard/settings.js"></script>
  <script type="module">
    import { initI18n } from '/assets/js/i18n/index.js';
    import { initTheme } from '/assets/js/ui/theme.js';
    import { mountLogoutButton } from '/assets/js/dashboard/guard.js';

    initTheme();
    initI18n();
    mountLogoutButton();

    const sidebar = document.getElementById('dashboard-sidebar');
    const backdrop = document.querySelector('[data-sidebar-backdrop]');
    const openBtn = document.querySelector('[data-sidebar-toggle]');
    const closeBtn = document.querySelector('[data-sidebar-close]');

    function openSidebar() {
      if (!sidebar) return;
      sidebar.classList.add('is-open');
      if (backdrop) backdrop.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      if (!sidebar) return;
      sidebar.classList.remove('is-open');
      if (backdrop) backdrop.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    if (openBtn) openBtn.addEventListener('click', openSidebar);
    if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if (backdrop) backdrop.addEventListener('click', closeSidebar);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeSidebar();
    });
  </script>
</body>
</html>
